[package]
name = "game"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "miata"
path = "src/main.rs"

[dependencies]
drivetrain = { path = "../drivetrain" }
bevy = "0.19.1"
bevy_egui = "0.42"
leafwing-input-manager = "0.21"

[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { version = "0.19.1", features = ["web"] }
