[workspace]
resolver = "3"
members = ["crates/drivetrain", "crates/game"]

[workspace.package]
edition = "2024"
rust-version = "1.95"

# Bevy is slow unoptimised; optimise dependencies even in dev builds.
[profile.dev.package."*"]
opt-level = 2

# Browser build: small download over raw speed. CI builds with --profile web.
[profile.web]
inherits = "release"
opt-level = "s"
lto = "thin"
strip = true
