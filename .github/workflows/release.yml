name: Release

# Tag a version (git tag v0.1.0 && git push --tags) to build desktop apps and
# attach them to a GitHub Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build both architectures
        run: |
          cargo build --release -p game --target aarch64-apple-darwin
          cargo build --release -p game --target x86_64-apple-darwin
      - name: Universal .app bundle
        run: |
          APP=dist/miata.app/Contents
          mkdir -p "$APP/MacOS"
          lipo -create -output "$APP/MacOS/miata" \
            target/aarch64-apple-darwin/release/miata target/x86_64-apple-darwin/release/miata
          cat > "$APP/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>miata</string>
            <key>CFBundleDisplayName</key><string>miata</string>
            <key>CFBundleIdentifier</key><string>io.github.lubabs770.miata</string>
            <key>CFBundleExecutable</key><string>miata</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${GITHUB_REF_NAME#v}</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          PLIST
          # Unsigned: first launch needs right-click → Open.
          cd dist && ditto -c -k --keepParent miata.app miata-macos-universal.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/miata-macos-universal.zip

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bevy Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ pkg-config libx11-dev \
            libasound2-dev libudev-dev libxkbcommon-x11-0 libwayland-dev libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p game
      - run: |
          mkdir -p dist/miata
          cp target/release/miata README.md LICENSE dist/miata/
          tar -C dist -czf dist/miata-linux-x86_64.tar.gz miata
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/miata-linux-x86_64.tar.gz

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
